<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tasty Travels - Drink Shooter</title>
  <link rel="stylesheet" href="styles/game_style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8297236479051371"
     crossorigin="anonymous"></script>
</head>
<body>

  <div id="wrapper">

    <!-- HUD (üst panel) -->
    <div id="hud">
      <div id="hud-left">
        <span id="coinDisplay">🪙 4200</span>
      </div>
      <div id="hud-center">
        <span id="levelDisplay">LV 1</span>
      </div>
      <div id="hud-right">
        <span id="scoreDisplay">0 XP</span>
      </div>
    </div>

    <!-- Oyun kətan -->
    <canvas id="gameCanvas"></canvas>

    <!-- Alt panel: shooter tray -->
    <div id="tray">
      <div id="nextBox">
        <p>NEXT</p>
        <canvas id="nextCanvas" width="48" height="48"></canvas>
      </div>
      <div id="currentBox">
        <canvas id="currentCanvas" width="64" height="64"></canvas>
      </div>
      <div id="controls">
        <button id="btnSound" title="Səs">🔊</button>
        <button id="btnReset" title="Yenidən">🔄</button>
      </div>
    </div>

  </div>

  <!-- Game Over overlay -->
  <div id="overlayGameOver" class="overlay hidden">
    <div class="overlay-box">
      <h2>😵 GAME OVER</h2>
      <p>Score: <strong id="finalScore">0</strong></p>
      <p>Coins: <strong id="finalCoins">0</strong></p>
      <button onclick="restartGame()">🔄 Yenidən Oyna</button>
    </div>
  </div>

  <!-- Level Up overlay -->
  <div id="overlayLevelUp" class="overlay hidden">
    <div class="overlay-box level-box">
      <h2>🎉 Növbəti Səviyyə!</h2>
      <p id="levelUpText">Səviyyə 2</p>
      <button onclick="nextLevel()">▶️ Davam Et</button>
    </div>
  </div>

  <script src="scripts/game_engine.js"></script>
</body>
</html>
